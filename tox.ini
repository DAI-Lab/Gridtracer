[tox]
envlist = py39, py310, py311, py312, lint, docs
[travis]
python =
    3.12: py312, docs, lint
    3.11: py311
    3.10: py310
    3.9: py39

[testenv]
passenv = CI,TRAVIS,TRAVIS_*
allowlist_externals = make
setenv =
    PYTHONPATH = {toxinidir}
extras = test
commands =
    make test


[testenv:lint]
skipsdist = true
allowlist_externals = make
extras = dev
commands =
    make lint


[testenv:docs]
skipsdist = true
allowlist_externals = make
extras = dev
commands =
    make docs
